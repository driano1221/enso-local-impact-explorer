<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Revisão responsiva · ENSO Local</title>
<style>body{margin:0;background:#d6e0e3;font:14px system-ui}nav{display:flex;gap:12px;align-items:center;padding:12px;position:sticky;top:0;background:#fff;z-index:2}button{padding:8px 16px}iframe{display:block;border:0;margin:20px auto;background:white;width:375px;height:820px}label{margin-left:auto}</style>
<nav>Viewport de teste <button data-width="320">320</button><button data-width="375">375</button><button data-width="768">768</button><button data-width="900">900</button><button data-width="1440">1440</button><button id="audit">Conferir cortes</button><button id="performance">Recursos carregados</button><output id="result"></output></nav>
<iframe src="/" title="Painel mundial em largura controlada"></iframe>
<script>document.getElementById('performance').onclick=()=>{const frame=document.querySelector('iframe');const entries=frame.contentWindow.performance.getEntriesByType('resource');document.getElementById('result').textContent=JSON.stringify({resources:entries.length,plotly:entries.filter(e=>e.name.includes('plotly-basic')).map(e=>({url:e.name,bytes:e.decodedBodySize})),maps:entries.filter(e=>/mapa.json|regiao.json/.test(e.name)).map(e=>e.name),explainer:frame.contentDocument.querySelector('.pacifico-frame').getAttribute('src')});};</script>
<script>const f=document.querySelector('iframe');function resizeTo(w){const gutter=f.offsetWidth-f.contentDocument.documentElement.clientWidth;f.style.width=(Number(w)+gutter)+'px'};f.addEventListener('load',()=>resizeTo(375));document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>resizeTo(b.dataset.width));document.getElementById('audit').onclick=()=>{const d=f.contentDocument,w=d.documentElement.clientWidth;if(!d.querySelector('h1')?.textContent.trim() || !d.querySelector('.js-plotly-plot')){document.getElementById('result').textContent='AGUARDE: dados ainda não renderizados';return;}const bad=[...d.querySelectorAll('main *,header *')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.height&&(r.left<-.5||r.right>w+.5)&&!e.closest('.modebar,.plotly-notifier')});document.getElementById('result').textContent=JSON.stringify({width:w,scroll:d.documentElement.scrollWidth,overflow:bad.map(e=>e.tagName+'.'+e.getAttribute('class')).slice(0,12)});};</script></html>
